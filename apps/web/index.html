<title>Daily Anchor</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block" />
<script src="theme-init.js"></script>
<link rel="stylesheet" href="styles.css" />
<style>
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 2.2fr) minmax(260px, 1fr);
    gap: 2rem;
    align-items: start;
  }

  .videos-column h2,
  .headlines-column h2 {
    font-size: 1.1rem;
    margin: 0;
  }

  .headline-group {
    margin-bottom: 1.5rem;
  }

  .headline-group h3 {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 0.5rem;
  }

  .headlines {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .headline {
    display: flex;
    gap: 0.7rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem;
  }

  .headline-img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 6px;
    background: #dfe3ea;
    flex-shrink: 0;
  }

  .headline-body {
    flex: 1;
    min-width: 0;
  }

  .headline a {
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.92rem;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .headline a:hover {
    text-decoration: underline;
  }

  .headline a .ext-icon {
    font-size: 14px;
    vertical-align: -2px;
    color: var(--muted);
  }

  .headline .meta {
    margin-top: 0.3rem;
  }

  /* Top News / Headlines sub-tabs, mobile only. Desktop keeps both columns visible. */
  .subtabs {
    display: none;
  }

  @media (max-width: 860px) {
    .layout {
      grid-template-columns: 1fr;
    }

    .subtabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.1rem;
    }

    .subtab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem;
      cursor: pointer;
    }

    .subtab.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    main[data-mobile-view="top-news"] .headlines-column {
      display: none;
    }

    main[data-mobile-view="headlines"] .videos-column {
      display: none;
    }
  }
</style>

<div id="app-header"></div>

<div class="drawer-backdrop" id="drawer-backdrop"></div>
<div class="app-body">
  <nav class="sidebar" id="sidebar">
    <button class="sidebar-close" type="button" id="sidebar-close" aria-label="Close menu">
      <span class="material-symbols-outlined">close</span>
    </button>
    <a class="nav-item" href="index.html" aria-current="page"><span class="material-symbols-outlined">today</span> Home</a>
    <a class="nav-item" href="courses.html"><span class="material-symbols-outlined">school</span> Courses</a>
  </nav>

  <main data-mobile-view="top-news">
    <div class="subtabs">
      <button class="subtab active" type="button" data-hometab="top-news">
        <span class="material-symbols-outlined">play_circle</span> Top News
      </button>
      <button class="subtab" type="button" data-hometab="headlines">
        <span class="material-symbols-outlined">newspaper</span> Headlines
      </button>
    </div>

    <div class="layout">
      <section class="videos-column">
        <h2 id="videos-heading"></h2>
        <div class="last-updated" id="videos-updated"></div>
        <div id="status" class="sr-only">Loading videos…</div>
        <div class="card-grid" id="videos"></div>
      </section>

      <section class="headlines-column">
        <h2>Latest Headlines</h2>
        <div class="last-updated" id="headlines-updated"></div>
        <div id="headlines-status" class="sr-only">Loading headlines…</div>
        <div id="headlines"></div>
      </section>
    </div>
  </main>
</div>

<footer>
  <div class="subscribe">
    <div class="subscribe-copy">
      <strong>Get the daily digest</strong>
      <p>The day's best picks, distilled into one email.</p>
    </div>
    <div id="footer-cta"></div>
  </div>
</footer>

<div class="toast" id="toast">
  <span class="material-symbols-outlined" id="toast-icon"></span>
  <span id="toast-message"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="playlists.js"></script>
<script src="helpers.js"></script>
<script>
  const VIDEOS_PLAYLIST = "top-news";

  function renderHeadlineSkeletons(count) {
    return `
      <ul class="headlines">
        ${Array.from({ length: count })
          .map(
            () => `
          <li class="headline">
            <div class="headline-img skeleton"></div>
            <div class="headline-body">
              <div class="skeleton line" style="width: 95%"></div>
              <div class="skeleton line" style="width: 75%; margin-top: 0.5rem;"></div>
              <div class="skeleton line" style="width: 35%; margin-top: 0.5rem;"></div>
            </div>
          </li>
        `
          )
          .join("")}
      </ul>
    `;
  }

  async function loadVideos() {
    const { supabaseUrl, supabasePublishableKey } = window.ANCHOR_CONFIG;
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("videos");

    const playlistInfo = window.ANCHOR_PLAYLISTS?.[VIDEOS_PLAYLIST];
    document.getElementById("videos-heading").textContent = playlistInfo?.displayName ?? "Latest Videos";

    if (!supabaseUrl || !supabasePublishableKey) {
      statusEl.textContent = "Missing Supabase config — fill in config.js";
      statusEl.classList.remove("sr-only");
      return;
    }

    listEl.innerHTML = renderVideoSkeletons(6);

    const url = `${supabaseUrl}/rest/v1/videos?select=*&active=eq.true&playlist=eq.${VIDEOS_PLAYLIST}&order=idx.asc.nullslast,published_at.desc,created_at.desc&limit=24`;

    try {
      const res = await fetch(url, {
        headers: {
          apikey: supabasePublishableKey,
          Authorization: `Bearer ${supabasePublishableKey}`,
        },
      });

      if (!res.ok) {
        throw new Error(`Supabase request failed: ${res.status}`);
      }

      const videos = await res.json();

      if (videos.length === 0) {
        listEl.innerHTML = "";
        statusEl.textContent = "No videos yet.";
        statusEl.classList.remove("sr-only");
        return;
      }

      const lastUpdated = videos.reduce((max, v) => Math.max(max, new Date(v.created_at).getTime()), 0);
      if (lastUpdated) {
        document.getElementById("videos-updated").textContent = `Last updated ${formatMinutesAgo(lastUpdated)}`;
      }

      statusEl.remove();
      listEl.innerHTML = videos
        .map(
          (v) => `
        <div class="video">
          <button class="thumb" type="button" data-video-id="${escapeAttr(v.youtube_video_id)}" aria-label="Play ${escapeAttr(v.title)}">
            <img src="https://img.youtube.com/vi/${escapeAttr(v.youtube_video_id)}/hqdefault.jpg" alt="" loading="lazy" />
            <span class="play-badge"></span>
            ${v.duration ? `<span class="duration">${formatDuration(v.duration)}</span>` : ""}
          </button>
          <div class="video-body">
            <span class="title">${escapeHtml(v.title)}</span>
            <div class="meta">
              <span>${escapeHtml(v.channel_name ?? "")}</span>
              ${v.views != null ? `<span>· ${formatViews(v.views)} views</span>` : ""}
              ${v.published_at ? `<span>· ${formatMinutesAgo(new Date(v.published_at).getTime())}</span>` : ""}
            </div>
          </div>
        </div>
      `
        )
        .join("");

      listEl.addEventListener("click", onThumbGridClick);
      markViewedBadges(listEl, videos.map((v) => v.youtube_video_id));
    } catch (err) {
      listEl.innerHTML = "";
      statusEl.textContent = "Failed to load videos.";
      statusEl.classList.remove("sr-only");
      console.error(err);
    }
  }

  async function loadHeadlines() {
    const { supabaseUrl, supabasePublishableKey } = window.ANCHOR_CONFIG;
    const statusEl = document.getElementById("headlines-status");
    const listEl = document.getElementById("headlines");

    if (!supabaseUrl || !supabasePublishableKey) {
      statusEl.textContent = "Missing Supabase config — fill in config.js";
      statusEl.classList.remove("sr-only");
      return;
    }

    listEl.innerHTML = renderHeadlineSkeletons(6);

    const url = `${supabaseUrl}/rest/v1/headlines?select=*&order=published_at.desc&limit=150`;

    // Controls display order; any category not listed here (e.g. a newly
    // added feed) still renders, just appended after these.
    const CATEGORY_ORDER = [
      "Breaking News",
      "India",
      "Economics",
      "Tech & AI",
      "Science",
      "Media Literacy",
      "Ideas & Thinking",
      "Self-Improvement",
    ];
    const MAX_PER_CATEGORY = 5;

    try {
      const res = await fetch(url, {
        headers: {
          apikey: supabasePublishableKey,
          Authorization: `Bearer ${supabasePublishableKey}`,
        },
      });

      if (!res.ok) {
        throw new Error(`Supabase request failed: ${res.status}`);
      }

      const headlines = await res.json();

      if (headlines.length === 0) {
        listEl.innerHTML = "";
        statusEl.textContent = "No headlines yet.";
        statusEl.classList.remove("sr-only");
        return;
      }

      const lastUpdated = headlines.reduce((max, h) => Math.max(max, new Date(h.created_at).getTime()), 0);
      if (lastUpdated) {
        document.getElementById("headlines-updated").textContent = `Last updated ${formatMinutesAgo(lastUpdated)}`;
      }

      const byCategory = new Map();
      for (const h of headlines) {
        const category = h.category ?? "Breaking News";
        if (!byCategory.has(category)) byCategory.set(category, []);
        if (byCategory.get(category).length < MAX_PER_CATEGORY) byCategory.get(category).push(h);
      }

      const orderedCategories = [
        ...CATEGORY_ORDER.filter((c) => byCategory.has(c)),
        ...[...byCategory.keys()].filter((c) => !CATEGORY_ORDER.includes(c)),
      ];

      statusEl.remove();
      listEl.innerHTML = orderedCategories
        .map(
          (category) => `
        <div class="headline-group">
          <h3>${escapeHtml(category)}</h3>
          <ul class="headlines">
            ${byCategory
              .get(category)
              .map(
                (h) => `
              <li class="headline">
                ${h.image_url ? `<img class="headline-img" src="${escapeAttr(h.image_url)}" alt="" loading="lazy" />` : ""}
                <div class="headline-body">
                  <a href="${escapeAttr(h.link)}" target="_blank" rel="noopener">${escapeHtml(h.title)} <span class="material-symbols-outlined ext-icon">open_in_new</span></a>
                  <div class="meta">
                    <span>${escapeHtml(h.source ?? "")}</span>
                  </div>
                </div>
              </li>
            `
              )
              .join("")}
          </ul>
        </div>
      `
        )
        .join("");
    } catch (err) {
      listEl.innerHTML = "";
      statusEl.textContent = "Failed to load headlines.";
      statusEl.classList.remove("sr-only");
      console.error(err);
    }
  }

  function initMobileHomeTabs() {
    const main = document.querySelector("main");
    document.querySelectorAll("[data-hometab]").forEach((btn) => {
      btn.addEventListener("click", () => {
        main.dataset.mobileView = btn.dataset.hometab;
        document.querySelectorAll("[data-hometab]").forEach((b) => b.classList.toggle("active", b === btn));
      });
    });
  }

  mountHeader();
  initThemeToggle();
  initSidebarDrawer();
  initAuthControl();
  initMobileHomeTabs();
  loadVideos();
  loadHeadlines();
</script>
