<title>Daily Anchor</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block" />
<script src="theme-init.js"></script>
<link rel="stylesheet" href="styles.css" />
<style>
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 2.2fr) minmax(260px, 1fr);
    gap: 2rem;
    align-items: start;
  }

  /* Continue Learning + Headlines stacked in the right column via a plain
     flex wrapper, not CSS Grid row-spanning: a spanning .videos-column
     next to a short first-row item inflates that row's track height to
     help fit the tall spanning item, leaving dead space below the short
     item. Nesting them avoids the row-track algorithm entirely. */
  .side-column {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* Desktop-only: separates Continue Learning from the headlines-column
     visible right beneath it in .side-column's flex stack. On mobile,
     headlines-column is hidden by default (see the headlines-only-view
     rules below) so Continue Learning is .side-column's only visible
     child; this margin would just add dead space before the shelf stack
     on top of .layout's own row gap, which is the mobile gap bug. */
  @media (min-width: 861px) {
    #continue-learning:not(:empty) {
      margin-bottom: 1.1rem;
    }

    /* Keeps Continue Learning + Headlines in view while the (usually much
       taller, especially with shelves expanded via "Show more") video
       column scrolls past. Sticky alone isn't enough here: headlines
       across every category easily add up to several viewports' worth
       (measured ~4000px against a ~800px viewport in testing), so with no
       height cap .side-column's containing block ends up roughly as tall
       as .side-column itself, leaving no slack for anything to visibly
       stick. Bounding it to the viewport (max-height) and letting the
       headlines list scroll internally (flex: 1 + its own overflow-y,
       not .side-column's) is what actually keeps it in view: Continue
       Learning, above the scrollable part, stays fully visible throughout
       rather than also scrolling away. top matches main's own desktop
       padding-top just above. */
    .side-column {
      position: sticky;
      top: 2rem;
      max-height: calc(100vh - 4rem);
    }

    .headlines-column {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
  }

  .videos-column h2,
  .headlines-column h2 {
    font-size: 1.1rem;
    margin: 0;
  }

  .home-intro {
    margin-bottom: 1.75rem;
  }

  .home-intro-date {
    margin: 0 0 0.3rem;
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1.25;
    color: var(--ink);
  }

  .home-intro-tagline {
    margin: 0;
    font-size: 0.92rem;
    color: var(--muted);
  }

  .headline-group {
    margin-bottom: 1.5rem;
  }

  .headline-group h3 {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 0.5rem;
  }

  .headlines {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .headline {
    display: flex;
    gap: 0.7rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem;
  }

  .headline-img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 6px;
    background: #dfe3ea;
    flex-shrink: 0;
  }

  .headline-body {
    flex: 1;
    min-width: 0;
  }

  .headline a {
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.92rem;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .headline a:hover {
    text-decoration: underline;
  }

  .headline a .ext-icon {
    font-size: 14px;
    vertical-align: -2px;
    color: var(--muted);
  }

  .headline .meta {
    margin-top: 0.3rem;
  }

  .shelf {
    margin-bottom: 1.75rem;
  }

  /* Only when there's an actual course to show: groups the streak badge,
     label, and cards into one bordered unit instead of three loose
     elements stacked with no shared boundary. A streak with no touched
     course yet (.shelf without this class, see renderShelf) stays a plain
     pill; a full card around one lone badge would be a lot of chrome for
     very little content. */
  .shelf-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.95rem 1.05rem;
  }

  .shelf-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 0.8rem;
  }

  .streak-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    flex-shrink: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.28rem 0.7rem;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--ink);
  }

  .streak-badge .material-symbols-outlined {
    font-size: 0.95rem;
  }

  .shelf-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }

  .shelf-row {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .shelf-card {
    display: block;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.15s ease;
  }

  .shelf-card:hover {
    border-color: var(--ink);
  }

  .shelf-card-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.6rem;
    margin-bottom: 0.4rem;
  }

  .shelf-card .title {
    min-width: 0;
    font-size: 0.85rem;
    font-weight: 700;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .shelf-card .count {
    flex-shrink: 0;
    font-size: 0.72rem;
    color: var(--muted);
  }

  .mini-progress {
    height: 5px;
    border-radius: 3px;
    background: var(--border);
    overflow: hidden;
  }

  .mini-progress > span {
    display: block;
    height: 100%;
    background: var(--ink);
  }

  /* Continue Learning slot's teaser row (see renderTeaserRow): sign-in
     prompt and/or paths teaser as fixed-shape cards that sit side by side
     when there's room and wrap to stacked, full-width cards when there
     isn't (a narrow desktop side column, or mobile). Plain flex-wrap
     rather than a viewport media query, so the same rule handles both;
     what matters is the container's actual width, not the breakpoint. */
  .shelf-compact {
    margin-bottom: 0.6rem;
  }

  .teaser-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
  }

  .teaser-card {
    flex: 1 1 170px;
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 0.85rem;
  }

  .teaser-card .material-symbols-outlined {
    font-size: 1.25rem;
    color: var(--muted);
  }

  .teaser-card strong {
    display: block;
    font-size: 0.8rem;
    line-height: 1.25;
    margin: 0.4rem 0 0.25rem;
  }

  .teaser-card p {
    flex: 1;
    margin: 0;
    font-size: 0.72rem;
    line-height: 1.35;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .teaser-card .btn-primary {
    margin-top: 0.55rem;
    align-self: flex-start;
    font-size: 0.76rem;
    padding: 0.35rem 0.7rem;
  }

  /* Wraps #home-feedback + <footer> (a sibling of .layout, not inside it),
     stacked full-width on mobile, side by side on desktop, so the two
     end-of-page cards don't leave one looking lonely next to a big empty
     gap. Owns the top spacing from the shelf stack above and zeroes out
     both children's own margin-top (.feedback-section's own 1.75rem,
     footer's sitewide 1.5rem from styles.css) so `gap` is the only thing
     spacing them apart, in both the stacked and side-by-side layouts. */
  .home-footer-row {
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
    margin-top: 1.75rem;
  }

  /* Overrides footer's sitewide margin-top (styles.css): this wrapper's
     own gap handles the spacing here instead. */
  .home-footer-row footer {
    margin-top: 0;
  }

  @media (min-width: 861px) {
    .home-footer-row {
      flex-direction: row;
      /* stretch (the flex default), not flex-start: the two cards read as
         a deliberate pair sized to match, not one arbitrarily taller than
         the other. Both cards' internal layout is adjusted below (height:
         100% + column flex + margin-top: auto on the action) so the extra
         height actually gets used instead of just padding out empty space
         at the bottom of whichever card is naturally shorter. */
      align-items: stretch;
    }

    .home-footer-row > * {
      flex: 1;
      min-width: 0;
    }

    /* height: 100% goes on .feedback-section, the descendant one level
       below the actual flex item (#home-feedback), not on #home-feedback
       itself. An explicit height on a flex item can override align-items:
       stretch instead of just relying on it (a definite height "wins" over
       stretch per the flex spec), so #home-feedback is left alone to
       stretch naturally; .feedback-section just inherits that resulting
       height via percentage. */
    .home-footer-row .feedback-section {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* loadFeedbackCard() renders exactly one of two different components
       here depending on sign-in state (.signin-prompt for signed out, or
       .feedback-card for signed in), and this needs to stretch to match
       .subscribe's height either way. flex: 1 (grow to fill) on "whichever
       single child .feedback-section has" does that generically, rather
       than a height: 100% rule naming .feedback-card specifically, which
       would silently stop working the moment a different variant renders
       (as it already did for the signed-out state, which needed the same
       treatment but wasn't covered). Deliberately not also forcing
       display/flex-direction here: .signin-prompt (styles.css) already
       declares its own row layout (icon, text, button side by side) and
       just needs to grow taller so that layout's own align-items: center
       vertically centers it in the extra space; overriding it to a column
       would stack the icon/text/button instead. */
    .home-footer-row .feedback-section > * {
      flex: 1;
      box-sizing: border-box;
    }

    /* Unlike .signin-prompt (styles.css), .feedback-card's base rule (also
       styles.css) has no display/direction of its own: it does need the
       column treatment, so it's given one here explicitly, scoped to this
       layout rather than changed globally. */
    .home-footer-row .feedback-card {
      display: flex;
      flex-direction: column;
    }

    .home-footer-row .subscribe {
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .home-footer-row .feedback-form {
      flex: 1;
    }

    .home-footer-row .feedback-form textarea {
      flex: 1;
    }

    /* .subscribe's base rule (styles.css) lays it out as one centered row
       (copy left, button right), sized for its old spot as a short,
       standalone strip. Restructured to a column here so it mirrors
       .feedback-card's shape (copy on top, action pinned to the bottom via
       margin-top: auto), which is what makes the stretched height actually
       look intentional instead of just a big box with a centered row
       floating in the middle of it. */
    .home-footer-row .subscribe {
      align-items: flex-start;
    }

    .home-footer-row #footer-cta {
      margin-top: auto;
      align-self: flex-end;
    }
  }

  /* All rolling content (Top News, split into per-region shelves;
     Explainers, Business, and any genre added later) renders as one
     vertical stack of .home-shelf blocks in .videos-column, in that order.
     No tabs: everything is always visible, on every width. Headlines keeps
     its own persistent side column (unchanged). */
  .home-shelf {
    margin-bottom: 2rem;
  }

  .home-shelf:last-child {
    margin-bottom: 0;
  }

  .shelf-actions {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  /* Sits below the grid as its own full-width row, not up in the heading
     next to Play All: reuses styles.css's .btn-secondary shape (block,
     full-width, subtle border) as-is, just given a distinct class so its
     text can be swapped between "Show more"/"Show less" without touching
     the shared button style. */
  .show-more-line {
    display: block;
    width: 100%;
    margin-top: 0.85rem;
    padding: 0.5rem 0.7rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
  }

  .show-more-line:hover {
    background: var(--card-bg);
    color: var(--ink);
  }

  /* Two-tier visual cap for a shelf's grid: "collapsed" shows the first 6
     (desktop) or 4 (mobile) cards, "Show more" switches to "expanded" which
     raises the cap to 12, not unlimited, still a curated amount. Plain
     descendant selectors, not the [hidden] attribute: an author display
     rule always beats [hidden]'s UA default, a bug this codebase has hit
     repeatedly (see .video-modal-error et al. in player.js's history), so
     these are the only rules controlling these cards' display. */
  .card-grid[data-cap-state="collapsed"] .video:nth-child(n + 7) {
    display: none;
  }

  .card-grid[data-cap-state="expanded"] .video:nth-child(n + 13) {
    display: none;
  }

  /* Headlines-only view (reached via the mobile-only sidebar nav item;
     see helpers.js and .nav-item-headlines) swaps out the shelf stack and
     Continue Learning entirely so headlines render full-width, instead of
     staying squeezed into the narrow side column. Works at any width, but
     in practice only ever reached on mobile, where the nav item lives. */
  main[data-home-view="headlines"] .videos-column,
  main[data-home-view="headlines"] #continue-learning {
    display: none;
  }

  main[data-home-view="headlines"] .layout {
    grid-template-columns: 1fr;
  }

  @media (max-width: 860px) {
    /* Desktop-only: mobile's top header bar already carries a tagline. */
    .home-intro {
      display: none;
    }

    .layout {
      grid-template-columns: 1fr;
      /* Default mobile view stacks Continue Learning (in .side-column,
         reordered first below) directly above the shelf stack, with
         headlines-column hidden: .layout's 2rem desktop gap was tuned for
         two side-by-side columns and reads as a big dead gap here since
         it's now a row gap between just a small card and the next section. */
      gap: 1.25rem;
    }

    .side-column {
      order: -1;
    }

    /* Default mobile view is shelves-only: headlines are reachable via the
       sidebar nav item instead (see main[data-home-view="headlines"] above),
       so they shouldn't also take up scroll space here at the same time. */
    main:not([data-home-view="headlines"]) .headlines-column {
      display: none;
    }

    .card-grid[data-cap-state="collapsed"] .video:nth-child(n + 5) {
      display: none;
    }

    /* Sticky per-shelf heading so a user mid-scroll through a long shelf
       (e.g. an expanded Top News · Global) can still see which shelf
       they're in. Needs its own background + z-index: it's a normal-flow
       sibling that comes *before* .card-grid in the DOM, so without these
       the grid's cards (later in DOM, no elevated stacking otherwise) would
       paint over it as they scroll underneath rather than the reverse.
       z-index: 10, not just an arbitrary "above" value: .card-menu-wrap
       (the video card's "..." button) sits at z-index: 2, same as this
       used to be, and a tie falls back to DOM order; .card-grid comes
       *after* this row, so the tied dot menu was winning and painting over
       the sticky bar (and its Play All button) as cards scrolled under it.
       10 clears that with headroom, while staying well under .auth-panel
       (45) and the video modal (200), which do need to sit above this.
       top: -1px, not 0: a 1-device-pixel gap otherwise appears at the very
       top of the sticky bar on scroll (a subpixel rounding artifact common
       to `position: sticky; top: 0`), letting a sliver of the card behind
       it show through; nudging the stick point 1px above the viewport edge
       closes it.
       Styled like a topbar (opaque background, bottom border, real vertical
       padding) rather than bare text sitting flush against the viewport
       edge, and forced to one line (title truncates instead of wrapping)
       so it doesn't grow taller than a normal bar while pinned. */
    .home-shelf .section-heading-row {
      position: sticky;
      top: -1px;
      z-index: 10;
      flex-wrap: nowrap;
      background: var(--bg);
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--border);
    }

    .home-shelf .section-heading-row h2 {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .home-shelf .section-heading-row .shelf-actions {
      flex-shrink: 0;
    }
  }
</style>

<div id="app-header"></div>

<div class="drawer-backdrop" id="drawer-backdrop"></div>
<div class="app-body">
  <nav class="sidebar" id="sidebar"></nav>

  <main>
    <div class="layout">
      <section class="videos-column">
        <!-- Desktop-only (mobile already has its own tagline in the top
             header bar; see renderHeader in helpers.js). A static sibling
             of #home-shelves, not inside it: renderHomeShelves() replaces
             that element's entire innerHTML, which would wipe this out. -->
        <div class="home-intro">
          <p class="home-intro-date" id="home-intro-date"></p>
          <p class="home-intro-tagline">Curated news, explainers and more</p>
        </div>
        <!-- Populated entirely by renderHomeShelves() below: one .home-shelf
             per region-slice of Top News, then one per additional rolling
             playlist (Explainers, Business, ...). No static per-shelf markup
             here: the region split means the shelf count isn't known until
             the data comes back. -->
        <div id="home-shelves"></div>
      </section>

      <div class="side-column">
        <div id="continue-learning"></div>

        <section class="headlines-column">
          <h2>Latest Headlines</h2>
          <div class="last-updated" id="headlines-updated"></div>
          <div id="headlines-status" class="sr-only">Loading headlines…</div>
          <div id="headlines"></div>
        </section>
      </div>
    </div>

    <div class="home-footer-row">
      <!-- Visible to everyone (so its existence is discoverable), but the
           actual form only renders once signed in; see loadFeedbackCard(). -->
      <div id="home-feedback"></div>

      <footer>
        <div class="subscribe">
          <div class="subscribe-copy" id="footer-copy">
            <strong>Get the daily digest</strong>
            <p>The day's best picks, distilled into one email.</p>
          </div>
          <div id="footer-cta"></div>
        </div>
      </footer>
    </div>
  </main>
</div>

<div class="toast" id="toast">
  <span class="material-symbols-outlined" id="toast-icon"></span>
  <span id="toast-message"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="playlists.js"></script>
<script src="helpers.js"></script>
<script src="player.js"></script>
<script>
  function renderHeadlineSkeletons(count) {
    return `
      <ul class="headlines">
        ${Array.from({ length: count })
          .map(
            () => `
          <li class="headline">
            <div class="headline-img skeleton"></div>
            <div class="headline-body">
              <div class="skeleton line" style="width: 95%"></div>
              <div class="skeleton line" style="width: 75%; margin-top: 0.5rem;"></div>
              <div class="skeleton line" style="width: 35%; margin-top: 0.5rem;"></div>
            </div>
          </li>
        `
          )
          .join("")}
      </ul>
    `;
  }

  // loadVideos/loadHeadlines are re-called on every "anchor-filter-change"
  // (see the listener below), not just once at page load like before the
  // region/language filter existed: this guards the two things that broke
  // on a second call: #status getting .remove()'d the first time round
  // (later calls would find it null) and listEl.addEventListener stacking
  // a duplicate onThumbGridClick listener on every re-run.
  function showStatus(el, text) {
    if (!el) return;
    el.textContent = text;
    el.classList.remove("sr-only");
  }
  function hideStatus(el) {
    el?.classList.add("sr-only");
  }

  async function fetchPlaylistVideos(playlist, limit) {
    const { supabaseUrl, supabasePublishableKey } = window.ANCHOR_CONFIG;
    const { regions, languages } = getRegionLangFilter();
    const url = `${supabaseUrl}/rest/v1/videos?select=*&active=eq.true&playlist=eq.${playlist}&${regionLangQueryParams(regions, languages)}&order=idx.asc.nullslast,published_at.desc,created_at.desc&limit=${limit}`;
    const res = await fetch(url, {
      headers: { apikey: supabasePublishableKey, Authorization: `Bearer ${supabasePublishableKey}` },
    });
    if (!res.ok) throw new Error(`Supabase request failed: ${res.status}`);
    const rows = await res.json();
    // regionLangQueryParams is a coarse overlap pre-filter; narrow to the
    // precise per-row rule here (see regionMatchesFilter in helpers.js).
    return rows.filter((v) => matchesRegionLangFilter(v.region, v.language, regions, languages));
  }

  // Top News mixes channels of very different upload volume (e.g. WION
  // posts far more than AP), resolving each video down to one specific
  // region first (this function), then bucketing those into Global/home
  // region/Rest of the World (see renderHomeShelves), means a prolific
  // channel only crowds the bucket its region lands in, not every other
  // bucket's visibility. A channel's `region` is an array (e.g. WION is
  // {in, global}; see channels.ts), so this picks its most specific tag;
  // "global" is the leftover bucket for channels with no specific region.
  function regionShelfKey(regionArr) {
    if (!Array.isArray(regionArr) || regionArr.length === 0) return "global";
    return regionArr.find((r) => r !== "global") ?? "global";
  }

  function videoCardHtml(v) {
    return `
      <div class="video">
        <button class="thumb" type="button" data-video-id="${escapeAttr(v.youtube_video_id)}" data-title="${escapeAttr(v.title)}" data-channel="${escapeAttr(v.channel_name ?? "")}" data-duration="${v.duration ?? ""}" aria-label="Play ${escapeAttr(v.title)}">
          <img src="https://img.youtube.com/vi/${escapeAttr(v.youtube_video_id)}/hqdefault.jpg" alt="" loading="lazy" />
          <span class="play-badge"></span>
          ${v.duration ? `<span class="duration">${formatDuration(v.duration)}</span>` : ""}
        </button>
        ${renderCardMenu(v.youtube_video_id)}
        <div class="video-body">
          <span class="title">${escapeHtml(v.title)}</span>
          <div class="meta">
            <span>${escapeHtml(v.channel_name ?? "")}</span>
            ${v.views != null ? `<span>· ${formatViews(v.views)} views</span>` : ""}
            ${v.published_at ? `<span>· ${formatMinutesAgo(new Date(v.published_at).getTime())}</span>` : ""}
          </div>
        </div>
      </div>
    `;
  }

  // Lower of the two initial caps (desktop:6, mobile:4; see the CSS
  // data-cap-state rules) decides whether "Show more" is worth rendering at
  // all: a shelf with 5 videos needs it on mobile even though desktop
  // already shows all 5 unprompted. Clicking it always goes to "expanded"
  // (cap 12), never fully unlimited, still a curated amount, not the whole
  // fetched batch.
  const MOBILE_INITIAL_CAP = 4;

  // Cards beyond the active cap are already in the DOM, just hidden via
  // data-cap-state (see the .card-grid[data-cap-state] CSS rules): "Show
  // more" toggles that attribute rather than re-fetching, so it's instant
  // and the scroll position doesn't jump to a loading state.
  function shelfHtml(id, heading, videos, failed) {
    if (videos.length === 0) {
      const message = failed ? "Failed to load. Try refreshing the page." : "No videos yet. Check back soon.";
      return `
        <div class="home-shelf">
          <div class="section-heading-row"><h2>${escapeHtml(heading)}</h2></div>
          <p class="last-updated">${message}</p>
        </div>`;
    }

    const capped = videos.length > MOBILE_INITIAL_CAP;

    return `
      <div class="home-shelf">
        <div class="section-heading-row">
          <h2>${escapeHtml(heading)}</h2>
          <div class="shelf-actions">
            <button class="btn-primary play-all-btn" type="button" id="${id}-play-all">
              <span class="material-symbols-outlined">play_arrow</span> Play All
            </button>
          </div>
        </div>
        <div class="last-updated" id="${id}-updated"></div>
        <div class="card-grid" id="${id}" data-context-label="${escapeAttr(heading)}"${capped ? ' data-cap-state="collapsed"' : ""}>
          ${videos.map(videoCardHtml).join("")}
        </div>
        ${capped ? `<button class="show-more-line" type="button" id="${id}-more">Show more</button>` : ""}
      </div>`;
  }

  function wireShelf(id, videos) {
    if (videos.length === 0) return;
    const listEl = document.getElementById(id);

    listEl.addEventListener("click", onThumbGridClick);
    markViewedBadges(listEl, videos.map((v) => v.youtube_video_id));
    syncBookmarkMenuItems(listEl, videos.map((v) => v.youtube_video_id));
    revealCardMenus(listEl);

    document.getElementById(`${id}-play-all`).addEventListener("click", () => window.AnchorPlayer?.playAll(listEl));

    const moreBtn = document.getElementById(`${id}-more`);
    moreBtn?.addEventListener("click", () => {
      const collapsing = listEl.dataset.capState === "expanded";

      // Collapsing removes a whole grid's worth of cards *above* wherever
      // the user has since scrolled to, which shifts everything below it up
      // the page: the browser doesn't compensate scroll position for that
      // on its own, so without this the user lands somewhere unrelated, a
      // "few shelves up" from the button they just clicked. Recording the
      // button's own on-screen position before the toggle and scrolling by
      // the delta after keeps it (and the shelf around it) pinned to the
      // same spot on screen.
      //
      // Expanding deliberately does NOT get the same treatment: the newly-
      // revealed cards land above the button, and pinning the button in
      // place would scroll those new cards up out of view, the opposite of
      // what "show more" should do. Leaving scroll untouched lets the new
      // cards land right where the button used to be, in view, with the
      // button itself free to move down out of the viewport.
      const beforeTop = collapsing ? moreBtn.getBoundingClientRect().top : null;
      listEl.dataset.capState = collapsing ? "collapsed" : "expanded";
      moreBtn.textContent = collapsing ? "Show more" : "Show less";
      if (collapsing) window.scrollBy(0, moreBtn.getBoundingClientRect().top - beforeTop);
    });

    const updatedEl = document.getElementById(`${id}-updated`);
    const lastUpdated = videos.reduce((max, v) => Math.max(max, new Date(v.created_at).getTime()), 0);
    if (updatedEl && lastUpdated) {
      updatedEl.textContent = `Last updated ${formatMinutesAgo(lastUpdated)}`;
    }
  }

  // One coordinated render pass for the whole home shelf stack: Top News
  // (split into region shelves), then every other rolling playlist in
  // order. A single request token guards the whole pass since
  // "anchor-filter-change" can fire again before these fetches resolve; the
  // container's entire innerHTML is replaced on each render, which also
  // means old shelves' listeners are discarded with their DOM rather than
  // needing manual cleanup.
  //
  // Promise.allSettled, not Promise.all: these three fetches are
  // independent playlists, not one atomic operation, so one failing (a
  // network blip on just the business query, say) shouldn't blank Top
  // News and Explainers too: each failed playlist renders its own
  // "failed to load" shelf instead of taking the whole stack down with it.
  let homeShelvesRequestToken = 0;

  // Every rolling playlist below Top News: each is one shelf, in this
  // order. Adding another genre later is just one more entry here (plus
  // its own jobs/<name>/ folder and playlists.js registration); no
  // rendering/fetch code to touch. Also update the matching filterValues
  // list in apps/automation/src/jobs/archive/tables.ts (retention rule for
  // these playlists); the two lists aren't shared, so they only stay in
  // sync manually.
  const SINGLE_SHELF_PLAYLISTS = ["explainers", "talks", "business", "podcasts"];

  async function renderHomeShelves() {
    const thisToken = ++homeShelvesRequestToken;
    const container = document.getElementById("home-shelves");
    const { supabaseUrl, supabasePublishableKey } = window.ANCHOR_CONFIG;

    if (!supabaseUrl || !supabasePublishableKey) {
      container.innerHTML = `<p class="last-updated">Missing Supabase config. Fill in config.js.</p>`;
      return;
    }

    // Mirrors shelfHtml's real .home-shelf/.section-heading-row/.last-updated/
    // .card-grid structure - a flat skeleton dump here had no grid to lay
    // cards out in, stacking into one tall block instead of several small
    // shelves. Three fake shelves, not an exact count (depends on the
    // region split, not known yet). The second line stands in for
    // .last-updated, whose margin is what separates heading from grid.
    container.innerHTML = Array.from(
      { length: 3 },
      () => `
      <div class="home-shelf">
        <div class="section-heading-row"><div class="skeleton line" style="width: 160px; height: 1.4rem;"></div></div>
        <div class="skeleton line" style="width: 110px; height: 0.78rem; margin: 0.2rem 0 0.85rem;"></div>
        <div class="card-grid">${renderVideoSkeletons(6)}</div>
      </div>`
    ).join("");

    const { homeRegion } = getRegionLangFilter();

    const [topNewsResult, ...playlistResults] = await Promise.allSettled([
      // 250, not 60: this fetch is a single global "newest N" query, split
      // into Global/home-region/Rest-of-the-World buckets only after the
      // fact (see regionShelfKey below), so the limit has to cover the
      // whole live retained pool, not just what's shown. Archive retention
      // (tables.ts) keeps up to 12 rows per CHANNEL, not per bucket, and
      // channels.ts now has 19 channels (9 global, 10 regional, India alone
      // has 3); worst case is 19 * 12 = 228 rows live at once. A smaller
      // limit could still truncate the oldest rows platform-wide before
      // grouping, silently under-filling whichever bucket's channels are
      // currently least-recently-updated. 250 covers the true max pool with
      // headroom; bump this again in lockstep with channels.ts if more
      // channels are added (see that file's own retention-vs-fetch-limit
      // coupling note).
      fetchPlaylistVideos("top-news", 250),
      ...SINGLE_SHELF_PLAYLISTS.map((playlist) => fetchPlaylistVideos(playlist, 12)),
    ]);
    if (thisToken !== homeShelvesRequestToken) return;

    const shelves = [];
    // Rest of the World is appended after every other shelf (including the
    // single-shelf playlists below), not right after Global/home: it's the
    // catch-all for whatever didn't earn a dedicated spot, so it belongs at
    // the bottom of the whole stack, not competing for top-of-page space.
    let restShelf = null;

    if (topNewsResult.status === "fulfilled") {
      // Fixed 2-3 bucket model instead of one shelf per distinct region:
      // different viewers want different granularity (some want a shelf per
      // region, others just want "my region + everything else lumped
      // together"), a personal "home region" pick is the one variable that
      // captures that, everything else funnels into one shared bucket. See
      // flo/2608-anchor session notes for why this replaced the old
      // one-shelf-per-present-region approach.
      const globalVideos = [];
      const homeVideos = [];
      const restVideos = [];
      for (const v of topNewsResult.value) {
        const key = regionShelfKey(v.region);
        if (key === "global") globalVideos.push(v);
        else if (homeRegion && key === homeRegion) homeVideos.push(v);
        else restVideos.push(v);
      }

      if (globalVideos.length > 0) shelves.push({ id: "topnews-global", heading: "Top News · Global", videos: globalVideos });
      if (homeRegion && homeVideos.length > 0) {
        const homeDisplayName = window.ANCHOR_HOME_REGIONS?.find((r) => r.key === homeRegion)?.displayName ?? homeRegion;
        shelves.push({ id: "topnews-home", heading: `Top News · ${homeDisplayName}`, videos: homeVideos });
      }
      if (restVideos.length > 0) restShelf = { id: "topnews-rest", heading: "Top News · Rest of the World", videos: restVideos };
    } else {
      console.error(topNewsResult.reason);
      shelves.push({ id: "topnews-global", heading: "Top News", videos: [], failed: true });
    }

    SINGLE_SHELF_PLAYLISTS.forEach((playlist, i) => {
      const result = playlistResults[i];
      const heading = window.ANCHOR_PLAYLISTS?.[playlist]?.displayName ?? playlist;
      if (result.status === "fulfilled") {
        shelves.push({ id: `watch-${playlist}`, heading, videos: result.value });
      } else {
        console.error(result.reason);
        shelves.push({ id: `watch-${playlist}`, heading, videos: [], failed: true });
      }
    });

    if (restShelf) shelves.push(restShelf);

    container.innerHTML = shelves.map((s) => shelfHtml(s.id, s.heading, s.videos, s.failed)).join("");
    shelves.forEach((s) => wireShelf(s.id, s.videos));
  }

  let headlinesRequestToken = 0;

  async function loadHeadlines() {
    const requestToken = ++headlinesRequestToken;
    const { supabaseUrl, supabasePublishableKey } = window.ANCHOR_CONFIG;
    const statusEl = document.getElementById("headlines-status");
    const listEl = document.getElementById("headlines");

    if (!supabaseUrl || !supabasePublishableKey) {
      showStatus(statusEl, "Missing Supabase config. Fill in config.js.");
      return;
    }

    listEl.innerHTML = renderHeadlineSkeletons(6);

    const { regions, languages } = getRegionLangFilter();
    const url = `${supabaseUrl}/rest/v1/headlines?select=*&${regionLangQueryParams(regions, languages)}&order=published_at.desc&limit=150`;

    // Controls display order; any category not listed here (e.g. a newly
    // added feed) still renders, just appended after these. Was missing
    // World Affairs/Health/Environment & Climate/Long-form & Culture (added
    // in a later session than this list); they fell through to whatever
    // order their freshest headline happened to land in, reshuffling day to
    // day. Slotted in next to their nearest thematic neighbor below.
    const CATEGORY_ORDER = [
      "Breaking News",
      "World Affairs",
      "India",
      "Economics",
      "Tech & AI",
      "Science",
      "Space",
      "Environment & Climate",
      "Health",
      "Media Literacy",
      "Ideas & Thinking",
      "Self-Improvement",
      "Long-form & Culture",
      // Deliberately last: this sidebar's job is staying informed, not
      // escaping (mirrors playlists.js's entertainment tier doing the
      // opposite: sports-stunts leads there since that tier's whole
      // point is escaping).
      "Sports",
      "Gaming & Pop Culture",
      "Food & Culture",
    ];
    const MAX_PER_CATEGORY = 5;

    try {
      const res = await fetch(url, {
        headers: {
          apikey: supabasePublishableKey,
          Authorization: `Bearer ${supabasePublishableKey}`,
        },
      });

      if (!res.ok) {
        throw new Error(`Supabase request failed: ${res.status}`);
      }

      // regionLangQueryParams is a coarse overlap pre-filter; narrow to the
      // precise per-row rule here (see regionMatchesFilter in helpers.js).
      const headlines = (await res.json()).filter((h) => matchesRegionLangFilter(h.region, h.language, regions, languages));
      if (requestToken !== headlinesRequestToken) return;

      if (headlines.length === 0) {
        listEl.innerHTML = "";
        showStatus(statusEl, "No headlines yet.");
        return;
      }

      const lastUpdated = headlines.reduce((max, h) => Math.max(max, new Date(h.created_at).getTime()), 0);
      if (lastUpdated) {
        document.getElementById("headlines-updated").textContent = `Last updated ${formatMinutesAgo(lastUpdated)}`;
      }

      const byCategory = new Map();
      for (const h of headlines) {
        const category = h.category ?? "Breaking News";
        if (!byCategory.has(category)) byCategory.set(category, []);
        if (byCategory.get(category).length < MAX_PER_CATEGORY) byCategory.get(category).push(h);
      }

      const orderedCategories = [
        ...CATEGORY_ORDER.filter((c) => byCategory.has(c)),
        ...[...byCategory.keys()].filter((c) => !CATEGORY_ORDER.includes(c)),
      ];

      hideStatus(statusEl);
      listEl.innerHTML = orderedCategories
        .map(
          (category) => `
        <div class="headline-group">
          <h3>${escapeHtml(category)}</h3>
          <ul class="headlines">
            ${byCategory
              .get(category)
              .map(
                (h) => `
              <li class="headline">
                ${h.image_url ? `<img class="headline-img" src="${escapeAttr(h.image_url)}" alt="" loading="lazy" />` : ""}
                <div class="headline-body">
                  <a href="${escapeAttr(h.link)}" target="_blank" rel="noopener">${escapeHtml(h.title)} <span class="material-symbols-outlined ext-icon">open_in_new</span></a>
                  <div class="meta">
                    <span>${escapeHtml(h.source ?? "")}</span>
                  </div>
                </div>
              </li>
            `
              )
              .join("")}
          </ul>
        </div>
      `
        )
        .join("");
    } catch (err) {
      if (requestToken !== headlinesRequestToken) return;
      listEl.innerHTML = "";
      showStatus(statusEl, "Failed to load headlines.");
      console.error(err);
    }
  }

  // Consecutive days (ending today or yesterday; a day not yet started
  // shouldn't zero out a real streak) with at least one video touched
  // (in_progress or completed both count). Derived from
  // user_progress.updated_at rather than a separate daily_checkins table.
  function computeStreak(updatedAtList) {
    const days = new Set(updatedAtList.map((ts) => new Date(ts).toDateString()));
    const cursor = new Date();
    if (!days.has(cursor.toDateString())) cursor.setDate(cursor.getDate() - 1);
    let streak = 0;
    while (days.has(cursor.toDateString())) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  // Fixed-size cards for the Continue Learning slot's teaser row (see
  // renderTeaserRow): sign-in prompt and paths teaser today, room to add
  // more later since the row wraps instead of growing taller. All cards
  // share one shape (icon/title/desc/cta) so they stay the same
  // dimensions regardless of copy length (.teaser-card p clamps to 3
  // lines, see CSS).
  function teaserCard(icon, title, desc, ctaHtml) {
    return `
      <div class="teaser-card">
        <span class="material-symbols-outlined">${icon}</span>
        <strong>${escapeHtml(title)}</strong>
        <p>${escapeHtml(desc)}</p>
        ${ctaHtml}
      </div>`;
  }

  function renderSignInPrompt() {
    return teaserCard(
      "local_fire_department",
      "Track your progress and build a streak",
      "Sign in to pick up where you left off across every course.",
      `<button class="btn-primary" type="button" id="continue-signin">Sign in</button>`
    );
  }

  // Shown alongside renderSignInPrompt() (signed out) or in place of an
  // empty renderShelf() (signed in, zero course progress yet): anyone with
  // no Continue Learning shelf to show has no obvious entry point into the
  // course catalog otherwise. Dropped once real progress exists so it
  // doesn't keep competing with the shelf it was standing in for.
  function renderPathsTeaser() {
    return teaserCard(
      "route",
      "New here? Start with a Learning Path",
      "Curated course sequences for a goal, pick one and go step by step.",
      `<a class="btn-primary" href="paths.html">Browse paths</a>`
    );
  }

  // Wraps one or more teaserCard()s in a flex row that wraps (see
  // .teaser-row): cards sit side by side when the container has room,
  // stack full-width when it doesn't, so this slot can't keep squeezing
  // Latest Headlines below it as more teasers get added over time.
  function renderTeaserRow(cardsHtml) {
    return `
      <div class="shelf shelf-compact">
        <div class="teaser-row">${cardsHtml.join("")}</div>
      </div>`;
  }

  function renderShelf(cards, streak) {
    const streakBadge =
      streak > 0
        ? `<div class="streak-badge"><span class="material-symbols-outlined">local_fire_department</span> ${streak}-day streak</div>`
        : "";

    // No touched course yet (e.g. a streak built purely from watching Top
    // News videos), a lone streak pill doesn't need the full card treatment,
    // and "Continue Learning" would be a misleading label with nothing to
    // continue.
    if (cards.length === 0) return streakBadge ? `<div class="shelf">${streakBadge}</div>` : "";

    return `
      <div class="shelf shelf-panel">
        <div class="shelf-header">
          <p class="shelf-label">Continue Learning</p>
          ${streakBadge}
        </div>
        <div class="shelf-row">
          ${cards
            .map((c) => {
              const info = window.ANCHOR_PLAYLISTS[c.slug];
              const pct = Math.round((c.watched / c.total) * 100);
              return `
              <a class="shelf-card" href="course.html?slug=${encodeURIComponent(c.slug)}">
                <div class="shelf-card-top">
                  <span class="title">${escapeHtml(info.displayName)}</span>
                  <span class="count">${c.watched}/${c.total}</span>
                </div>
                <div class="mini-progress"><span style="width:${pct}%"></span></div>
              </a>`;
            })
            .join("")}
        </div>
      </div>`;
  }

  // Signed out: a soft upsell, not a wall: the whole rest of the site
  // works without an account, this is the one spot worth surfacing what
  // signing in actually buys you. Signed in with zero progress: nothing to
  // show yet, so nothing renders (an empty shelf reads as broken, not
  // inviting). Signed in with progress: real courses, most recently
  // touched first.
  // Re-run on "anchor-auth-change" (completing OTP without a reload), not
  // just once at page load: same overlapping-call hazard as loadVideos/
  // loadHeadlines/loadCourses, same request-token fix.
  let continueLearningRequestToken = 0;

  async function loadContinueLearning() {
    const requestToken = ++continueLearningRequestToken;
    const slot = document.getElementById("continue-learning");
    if (!slot || !window.ANCHOR_AUTH) return;

    const { session } = await window.ANCHOR_AUTH.getSession();
    if (requestToken !== continueLearningRequestToken) return;
    if (!session) {
      slot.innerHTML = renderTeaserRow([renderSignInPrompt(), renderPathsTeaser()]);
      slot.querySelector("#continue-signin").addEventListener("click", (event) => {
        // Same bubbling trap as the footer sign-in CTA in initAuthControl:
        // this button lives outside #auth-control, so without stopping
        // propagation here, this click would reach the document-level
        // "close if open" listener right after the synthetic click below
        // opens the panel, immediately closing it again.
        event.stopPropagation();
        document.getElementById("auth-toggle")?.click();
        document.getElementById("auth-toggle")?.scrollIntoView({ behavior: "smooth", block: "center" });
      });
      return;
    }

    // Capped: the shelf only ever shows the 3 most recently touched
    // courses and the streak only cares about recent days, so an unbounded
    // history isn't needed. Without a cap, a long-time user's full watch
    // history could grow the `in.()` filter below past URL length limits.
    const { data: progressRows, error } = await window.ANCHOR_AUTH.client
      .from("user_progress")
      .select("youtube_video_id, status, updated_at")
      .order("updated_at", { ascending: false })
      .limit(200);
    if (requestToken !== continueLearningRequestToken) return;
    if (error || !progressRows || progressRows.length === 0) {
      if (error) console.error(error);
      else slot.innerHTML = renderTeaserRow([renderPathsTeaser()]); // signed in, no watch history at all yet
      return;
    }

    const streak = computeStreak(progressRows.map((r) => r.updated_at));
    const updatedAtById = new Map(progressRows.map((r) => [r.youtube_video_id, r.updated_at]));
    const statusById = new Map(progressRows.map((r) => [r.youtube_video_id, r.status]));

    const { supabaseUrl, supabasePublishableKey } = window.ANCHOR_CONFIG;
    const idsParam = progressRows.map((r) => encodeURIComponent(r.youtube_video_id)).join(",");
    const res = await fetch(`${supabaseUrl}/rest/v1/videos?select=playlist,youtube_video_id&active=eq.true&youtube_video_id=in.(${idsParam})`, {
      headers: { apikey: supabasePublishableKey, Authorization: `Bearer ${supabasePublishableKey}` },
    });
    if (!res.ok) console.error(`Continue Learning: videos fetch failed (${res.status})`);
    const rows = res.ok ? await res.json() : [];
    if (requestToken !== continueLearningRequestToken) return;

    const courseSlugs = new Set(Object.entries(window.ANCHOR_PLAYLISTS ?? {}).filter(([, info]) => info.type === "course").map(([slug]) => slug));

    // A course only shows up here once at least one of its videos is
    // actually completed - merely starting one (in_progress) shouldn't
    // surface a "0/N" card.
    const byCourse = new Map();
    for (const row of rows) {
      if (!courseSlugs.has(row.playlist)) continue; // e.g. a watched top-news video, not a course
      if (statusById.get(row.youtube_video_id) !== "completed") continue;
      if (!byCourse.has(row.playlist)) byCourse.set(row.playlist, { watchedIds: new Set(), lastViewedAt: null });
      const entry = byCourse.get(row.playlist);
      entry.watchedIds.add(row.youtube_video_id);
      const at = updatedAtById.get(row.youtube_video_id);
      if (at && (!entry.lastViewedAt || at > entry.lastViewedAt)) entry.lastViewedAt = at;
    }

    if (byCourse.size === 0) {
      slot.innerHTML = renderShelf([], streak) + renderTeaserRow([renderPathsTeaser()]);
      return;
    }

    const touched = [...byCourse.entries()];
    const idLists = await Promise.allSettled(touched.map(([slug]) => fetchLessonIds(slug)));
    if (requestToken !== continueLearningRequestToken) return;

    const cards = touched
      .map(([slug, entry], i) => {
        const total = idLists[i].status === "fulfilled" ? idLists[i].value.length : null;
        return total ? { slug, watched: entry.watchedIds.size, total, lastViewedAt: entry.lastViewedAt } : null;
      })
      .filter(Boolean)
      .sort((a, b) => new Date(b.lastViewedAt) - new Date(a.lastViewedAt))
      .slice(0, 3);

    slot.innerHTML = renderShelf(cards, streak);
  }


  // On mobile, "Headlines" is a sidebar nav item (see renderSidebar in
  // helpers.js) rather than inline content: clicking it links to
  // index.html?view=headlines, which swaps the whole home screen to a
  // headlines-only view (see the main[data-home-view="headlines"] CSS)
  // instead of permanently taking up scroll space above the video shelves.
  // Desktop ignores this entirely: its side column already shows headlines
  // alongside the shelf stack at all times.
  const homeView = new URLSearchParams(location.search).get("view") === "headlines" ? "headlines" : "home";
  document.querySelector("main").dataset.homeView = homeView;

  // .home-intro is desktop-only (see its CSS), but harmless to always set:
  // the element just never renders on mobile.
  const introDateEl = document.getElementById("home-intro-date");
  if (introDateEl) {
    introDateEl.textContent = new Date().toLocaleDateString(undefined, {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric",
    });
  }

  mountHeader();
  mountSidebar(homeView);
  initThemeToggle();
  initSidebarDrawer();
  initAuthControl();
  initRegionLangFilter();

  loadHeadlines();
  window.addEventListener("anchor-filter-change", () => loadHeadlines());

  if (homeView !== "headlines") {
    renderHomeShelves();
    loadContinueLearning();
    loadFeedbackCard("home-feedback");
    window.addEventListener("anchor-filter-change", () => renderHomeShelves());
    // Completing sign-in (OTP) mid-session doesn't otherwise touch the
    // watched badges/card menu (computed once per render), the Continue
    // Learning shelf, or the feedback card (both show a sign-in prompt
    // until this re-runs them); headlines have no sign-in-dependent
    // rendering, so no need to reload those.
    window.addEventListener("anchor-auth-change", () => {
      renderHomeShelves();
      loadContinueLearning();
      loadFeedbackCard("home-feedback");
    });
  }
</script>
