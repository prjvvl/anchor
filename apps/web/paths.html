<title>Daily Anchor - Learning Paths</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block" />
<script src="theme-init.js"></script>
<link rel="stylesheet" href="styles.css" />
<style>
  /* Fewer, bigger cards than the site's default .card-grid (260px min) —
     8 paths is a short curated shortlist, not a directory to browse
     densely, so more room per card is the right trade. */
  #paths-content {
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  }

  .path-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.4rem 1.5rem;
    text-decoration: none;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }

  .path-card:hover {
    box-shadow: 0 6px 18px rgba(22, 35, 63, 0.1);
    transform: translateY(-2px);
  }

  .path-card-top {
    display: flex;
    align-items: flex-start;
    gap: 0.9rem;
  }

  /* Icon doubles as a progress ring — --path-pct (real watched/total data,
     set inline per card) draws a conic-gradient arc in --ink around it,
     same treatment as courses.html/path.html's .video-cta-icon, rather than
     a separate progress bar elsewhere in the card. Reads as a plain ring
     when there's no progress yet (signed out, or 0 watched). */
  .path-icon {
    flex-shrink: 0;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: conic-gradient(var(--ink) var(--path-pct, 0%), var(--border) 0);
  }

  .path-icon-inner {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--card-bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .path-icon-inner .material-symbols-outlined {
    font-size: 1.5rem;
    color: var(--ink);
  }

  .path-card-head {
    min-width: 0;
  }

  .path-card .title {
    font-size: 1.1rem;
    font-weight: 700;
    margin: 0 0 0.35rem;
  }

  .path-card .desc {
    color: var(--muted);
    font-size: 0.86rem;
    line-height: 1.4;
    margin: 0;
  }

  /* Sits above .path-card-top, hugging the top-right corner (align-self:
     flex-end within .path-card's column flex) rather than spanning full
     width below the title — reads as a corner badge, not another line of
     body text. */
  .path-meta-row {
    display: flex;
    align-self: flex-end;
  }

  /* Compact stand-in for the full step list on path.html — first few course
     names in sequence, not just a bare count, so the card hints at what's
     actually inside before clicking through. */
  .path-trail {
    color: var(--muted);
    font-size: 0.78rem;
    margin: 0;
    padding-top: 0.65rem;
    border-top: 1px solid var(--border);
  }

  /* Matches courses.html's .tier-empty: same "nothing here yet" treatment
     for consistency, even though ANCHOR_PATHS is never actually empty
     today (see paths.js). */
  .paths-empty {
    text-align: center;
    padding: 3.5rem 1rem;
    color: var(--muted);
  }

  .paths-empty .material-symbols-outlined {
    font-size: 2.2rem;
    display: block;
    margin: 0 auto 0.75rem;
  }

  .paths-empty p {
    max-width: 340px;
    margin: 0.35rem auto 0;
    font-size: 0.88rem;
    line-height: 1.5;
  }
</style>

<div id="app-header"></div>

<div class="drawer-backdrop" id="drawer-backdrop"></div>
<div class="app-body">
  <nav class="sidebar" id="sidebar"></nav>

  <main>
    <h2 class="page-heading">Learning Paths</h2>
    <p class="page-sub">Curated course sequences for a goal: pick one and go step by step. Not sure where to start? These are a good first stop.</p>
    <div id="status" class="sr-only">Loading paths…</div>
    <div class="card-grid" id="paths-content"></div>
  </main>
</div>

<div class="toast" id="toast">
  <span class="material-symbols-outlined" id="toast-icon"></span>
  <span id="toast-message"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="playlists.js"></script>
<script src="paths.js"></script>
<script src="helpers.js"></script>
<script>
  function showStatus(el, text) {
    if (!el) return;
    el.textContent = text;
    el.classList.remove("sr-only");
  }
  function hideStatus(el) {
    el?.classList.add("sr-only");
  }

  // First course's tier vs. last course's tier — paths.js's `courses` array
  // is already the suggested working order, so this is a cheap proxy for
  // "how much of a climb is this" without needing a real difficulty field.
  function tierSpanLabel(courseSlugs) {
    const tiers = courseSlugs
      .map((slug) => {
        const courseInfo = window.ANCHOR_PLAYLISTS?.[slug];
        const tierInfo = (window.ANCHOR_TIERS ?? []).find((t) => t.key === courseInfo?.tier);
        return tierInfo?.displayName ?? null;
      })
      .filter(Boolean);
    if (tiers.length === 0) return null;
    const first = tiers[0];
    const last = tiers[tiers.length - 1];
    return first === last ? first : `${first} → ${last}`;
  }

  // Stand-in for the full step list — first few course names in sequence,
  // not just a bare count.
  function courseTrailLabel(courseSlugs) {
    const names = courseSlugs.map((slug) => window.ANCHOR_PLAYLISTS?.[slug]?.displayName).filter(Boolean);
    const shown = names.slice(0, 3);
    const rest = names.length - shown.length;
    return shown.join(" → ") + (rest > 0 ? ` → +${rest} more` : "");
  }

  function pathCard(slug, info, watched, total) {
    const hasProgress = watched != null && total != null && total > 0;
    const pct = hasProgress ? Math.round((watched / total) * 100) : 0;
    const tierSpan = tierSpanLabel(info.courses);
    return `
      <a class="path-card" href="path.html?slug=${encodeURIComponent(slug)}" style="--path-pct: ${pct}%">
        <div class="path-meta-row">
          ${tierSpan ? `<span class="tier-pill">${escapeHtml(tierSpan)}</span>` : ""}
        </div>
        <div class="path-card-top">
          <span class="path-icon">
            <span class="path-icon-inner">
              <span class="material-symbols-outlined" aria-hidden="true">${info.icon ?? "route"}</span>
            </span>
          </span>
          <div class="path-card-head">
            <div class="title">${escapeHtml(info.displayName)}</div>
            <p class="desc">${escapeHtml(info.description ?? "")}</p>
          </div>
        </div>
        <p class="path-trail">${escapeHtml(courseTrailLabel(info.courses))}</p>
      </a>`;
  }

  function renderPathCardSkeletons(count) {
    return Array.from({ length: count })
      .map(
        () => `
        <div class="path-card">
          <div class="path-card-top">
            <div class="skeleton" style="width: 52px; height: 52px; border-radius: 50%;"></div>
            <div class="path-card-head" style="flex: 1;">
              <div class="skeleton line" style="width: 65%; height: 1.1rem;"></div>
              <div class="skeleton line" style="width: 95%; margin-top: 0.5rem;"></div>
            </div>
          </div>
        </div>`
      )
      .join("");
  }

  // Aggregate watched/total lessons across every course in a path, so the
  // card can show one combined progress ring (on .path-icon) rather than
  // per-course detail (that belongs on path.html). Best-effort: a course
  // whose lesson fetch fails is simply excluded from the total rather than
  // failing the whole card, same spirit as courses.html's Promise.allSettled
  // use.
  async function loadPaths() {
    const statusEl = document.getElementById("status");
    const contentEl = document.getElementById("paths-content");
    const { supabaseUrl, supabasePublishableKey } = window.ANCHOR_CONFIG;

    if (!supabaseUrl || !supabasePublishableKey) {
      showStatus(statusEl, "Missing Supabase config. Fill in config.js.");
      return;
    }

    const entries = Object.entries(window.ANCHOR_PATHS ?? {});
    if (entries.length === 0) {
      hideStatus(statusEl);
      contentEl.innerHTML = `
        <div class="paths-empty">
          <span class="material-symbols-outlined">hourglass_empty</span>
          <strong>No paths yet</strong>
          <p>Learning paths are still being curated. Check back soon, or browse courses directly from the sidebar.</p>
        </div>`;
      return;
    }

    contentEl.innerHTML = renderPathCardSkeletons(entries.length);

    try {
      const allSlugs = [...new Set(entries.flatMap(([, info]) => info.courses))];
      const [idResults, viewedSet] = await Promise.all([Promise.allSettled(allSlugs.map((slug) => fetchLessonIds(slug))), fetchViewedSet()]);
      const idsBySlug = Object.fromEntries(allSlugs.map((slug, i) => [slug, idResults[i].status === "fulfilled" ? idResults[i].value : []]));

      hideStatus(statusEl);
      contentEl.innerHTML = entries
        .map(([slug, info]) => {
          const ids = info.courses.flatMap((c) => idsBySlug[c] ?? []);
          const total = ids.length;
          const watched = viewedSet ? ids.filter((id) => viewedSet.has(id)).length : null;
          return pathCard(slug, info, watched, total);
        })
        .join("");
    } catch (err) {
      contentEl.innerHTML = "";
      showStatus(statusEl, "Failed to load paths.");
      console.error(err);
    }
  }

  mountHeader();
  mountSidebar("paths");
  initThemeToggle();
  initSidebarDrawer();
  initAuthControl();
  initRegionLangFilter();
  loadPaths();
  window.addEventListener("anchor-auth-change", loadPaths);
</script>
