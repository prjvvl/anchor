<title>Daily Anchor - Learning Path</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block" />
<script src="theme-init.js"></script>
<link rel="stylesheet" href="styles.css" />
<style>
  .breadcrumb {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 0 0 0.9rem;
  }

  .breadcrumb a {
    color: var(--muted);
  }

  .path-step {
    margin-bottom: 2.2rem;
  }

  .path-step:last-child {
    margin-bottom: 0;
  }

  .path-step-top {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.6rem;
  }

  .step-number {
    flex-shrink: 0;
    width: 1.9rem;
    height: 1.9rem;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
  }

  .path-step[data-complete="true"] .step-number {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }
</style>

<div id="app-header"></div>

<div class="drawer-backdrop" id="drawer-backdrop"></div>
<div class="app-body">
  <nav class="sidebar" id="sidebar"></nav>

  <main>
    <p class="breadcrumb"><a href="paths.html">Learning Paths</a> / <span id="path-crumb"></span></p>
    <h2 class="page-heading" id="path-title"></h2>
    <p class="page-sub" id="path-sub"></p>
    <div id="status" class="sr-only">Loading path…</div>
    <div id="path-steps"></div>
  </main>
</div>

<div class="toast" id="toast">
  <span class="material-symbols-outlined" id="toast-icon"></span>
  <span id="toast-message"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="playlists.js"></script>
<script src="paths.js"></script>
<script src="helpers.js"></script>
<script src="player.js"></script>
<script>
  function showStatus(el, text) {
    if (!el) return;
    el.textContent = text;
    el.classList.remove("sr-only");
  }
  function hideStatus(el) {
    el?.classList.add("sr-only");
  }

  // Same cap as courses.html's own PREVIEW_LIMIT, kept as a separate copy
  // since the two pages don't share a load function — see coursePreviewHtml
  // in helpers.js for what consumes it.
  const PREVIEW_LIMIT = 5;

  // Wraps the shared coursePreviewHtml (helpers.js) with this page's own
  // step-number/tier-pill header — a path is an ordered sequence of
  // courses, so that ordering needs to survive even though each step is now
  // a full video row rather than a plain text line.
  function pathStepHtml(index, courseSlug, courseInfo, ids, viewedSet, previewVideos, previewFailed) {
    const tierInfo = (window.ANCHOR_TIERS ?? []).find((t) => t.key === courseInfo?.tier);
    const count = ids?.length ?? null;
    const watched = viewedSet && ids ? ids.filter((id) => viewedSet.has(id)).length : null;
    const complete = count != null && count > 0 && watched === count;
    return `
      <div class="path-step" data-complete="${complete}">
        <div class="path-step-top">
          <span class="step-number">${complete ? '<span class="material-symbols-outlined" style="font-size:1.1rem;">check</span>' : index + 1}</span>
          ${tierInfo ? `<span class="tier-pill">${escapeHtml(tierInfo.displayName)}</span>` : ""}
        </div>
        ${coursePreviewHtml(courseSlug, courseInfo, ids, viewedSet, previewVideos, previewFailed)}
      </div>`;
  }

  // mountSidebar() replaces #sidebar's innerHTML wholesale, including
  // #sidebar-close, so a second call on a re-run (loadPath() re-runs on
  // "anchor-auth-change") would leave the *new* close button with no click
  // handler, silently breaking the mobile drawer. Same hazard/fix as
  // course.html's courseSetupDone.
  let pathSetupDone = false;

  async function loadPath() {
    const slug = new URLSearchParams(location.search).get("slug");
    const statusEl = document.getElementById("status");
    const stepsEl = document.getElementById("path-steps");
    const info = window.ANCHOR_PATHS?.[slug];

    if (!slug || !info) {
      showStatus(statusEl, "Path not found.");
      document.getElementById("path-title").textContent = "Path not found";
      if (!pathSetupDone) mountSidebar(null);
      pathSetupDone = true;
      return;
    }

    if (!pathSetupDone) {
      document.title = `Daily Anchor - ${info.displayName}`;
      document.getElementById("path-crumb").textContent = info.displayName;
      document.getElementById("path-title").textContent = info.displayName;
      document.getElementById("path-sub").textContent = info.description ?? "";
      mountSidebar("paths");
      pathSetupDone = true;
    }

    const { supabaseUrl, supabasePublishableKey } = window.ANCHOR_CONFIG;
    if (!supabaseUrl || !supabasePublishableKey) {
      showStatus(statusEl, "Missing Supabase config. Fill in config.js.");
      return;
    }

    // Mirrors pathStepHtml's real .path-step/.path-step-top wrapper (step
    // number circle + tier pill) around the shared course-preview skeleton -
    // without it, the numbered-step look only appears once real content
    // loads, never during the loading state itself.
    stepsEl.innerHTML = info.courses
      .map(
        () => `
      <div class="path-step">
        <div class="path-step-top">
          <span class="skeleton" style="width: 1.9rem; height: 1.9rem; border-radius: 50%;"></span>
          <span class="skeleton line" style="width: 70px; height: 1.1rem;"></span>
        </div>
        ${renderCoursePreviewSkeletons(1)}
      </div>`
      )
      .join("");

    try {
      const [idResults, previewResults, viewedSet] = await Promise.all([
        Promise.allSettled(info.courses.map((courseSlug) => fetchLessonIds(courseSlug))),
        Promise.allSettled(info.courses.map((courseSlug) => fetchCoursePreview(courseSlug, PREVIEW_LIMIT))),
        fetchViewedSet(),
      ]);

      hideStatus(statusEl);
      const previewsBySlug = info.courses.map((courseSlug, i) => (previewResults[i].status === "fulfilled" ? previewResults[i].value : null));
      stepsEl.innerHTML = info.courses
        .map((courseSlug, i) => {
          const courseInfo = window.ANCHOR_PLAYLISTS?.[courseSlug];
          const ids = idResults[i].status === "fulfilled" ? idResults[i].value : null;
          const previewFailed = previewResults[i].status !== "fulfilled";
          return pathStepHtml(i, courseSlug, courseInfo, ids, viewedSet, previewsBySlug[i], previewFailed);
        })
        .join("");
      info.courses.forEach((courseSlug, i) => wireCoursePreview(courseSlug, previewsBySlug[i]));
    } catch (err) {
      stepsEl.innerHTML = "";
      showStatus(statusEl, "Failed to load path.");
      console.error(err);
    }
  }

  mountHeader();

  // loadPath() calls mountSidebar() synchronously on its first call (before
  // its first await), so it must run before initThemeToggle()/
  // initAuthControl()/initSidebarDrawer()/initRegionLangFilter(), same
  // ordering requirement as course.html's loadCourse().
  loadPath();
  initThemeToggle();
  initAuthControl();
  initSidebarDrawer();
  initRegionLangFilter();
  window.addEventListener("anchor-auth-change", loadPath);
</script>
