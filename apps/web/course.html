<title>Daily Anchor - Course</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block" />
<script src="theme-init.js"></script>
<link rel="stylesheet" href="styles.css" />
<style>
  .breadcrumb {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 0 0 0.9rem;
  }

  .breadcrumb a {
    color: var(--muted);
  }

  .episode-badge {
    position: absolute;
    top: 6px;
    left: 6px;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 4px;
  }

  .resume-btn {
    margin: 0 0 1.4rem;
  }
</style>

<div id="app-header"></div>

<div class="drawer-backdrop" id="drawer-backdrop"></div>
<div class="app-body">
  <nav class="sidebar" id="sidebar"></nav>

  <main>
    <p class="breadcrumb"><a href="courses.html" id="course-crumb-tier">Courses</a> / <span id="course-crumb"></span></p>
    <div class="section-heading-row">
      <h2 class="page-heading" id="course-title"></h2>
      <button class="btn-primary play-all-btn" type="button" id="play-all-lessons" hidden>
        <span class="material-symbols-outlined">play_arrow</span> Play All
      </button>
    </div>
    <p class="page-sub" id="course-sub"></p>
    <div id="resume-slot"></div>
    <div id="status" class="sr-only">Loading lessons…</div>
    <div class="card-grid" id="lessons"></div>
  </main>
</div>

<footer>
  <div class="subscribe">
    <div class="subscribe-copy">
      <strong>Get the daily digest</strong>
      <p>The day's best picks, distilled into one email.</p>
    </div>
    <div id="footer-cta"></div>
  </div>
</footer>

<div class="toast" id="toast">
  <span class="material-symbols-outlined" id="toast-icon"></span>
  <span id="toast-message"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="playlists.js"></script>
<script src="helpers.js"></script>
<script src="player.js"></script>
<script>
  // Same card as the homepage video grid. Ordered courses (real idx) get an
  // episode number badge instead of a view count, since recency/views aren't
  // meaningful for a fixed, complete series.
  function renderLessons(videos, ordered) {
    return videos
      .map(
        (v, i) => `
        <div class="video">
          <button class="thumb" type="button" data-video-id="${escapeAttr(v.youtube_video_id)}" data-title="${escapeAttr(v.title)}" data-channel="${escapeAttr(v.channel_name ?? "")}" data-duration="${v.duration ?? ""}" aria-label="Play ${escapeAttr(v.title)}">
            <img src="https://img.youtube.com/vi/${escapeAttr(v.youtube_video_id)}/hqdefault.jpg" alt="" loading="lazy" />
            <span class="play-badge"></span>
            ${ordered ? `<span class="episode-badge">EP ${i + 1}</span>` : ""}
            ${v.duration ? `<span class="duration">${formatDuration(v.duration)}</span>` : ""}
          </button>
          <div class="video-body">
            <span class="title">${escapeHtml(v.title)}</span>
            <div class="meta">
              <span>${escapeHtml(v.channel_name ?? "")}</span>
              ${!ordered && v.views != null ? `<span>· ${formatViews(v.views)} views</span>` : ""}
            </div>
          </div>
        </div>`
      )
      .join("");
  }

  async function loadCourse() {
    const slug = new URLSearchParams(location.search).get("slug");
    const statusEl = document.getElementById("status");
    const lessonsEl = document.getElementById("lessons");
    const info = window.ANCHOR_PLAYLISTS?.[slug];

    if (!slug || !info || info.type !== "course") {
      statusEl.textContent = "Course not found.";
      statusEl.classList.remove("sr-only");
      document.getElementById("course-title").textContent = "Course not found";
      mountSidebar(null);
      return;
    }

    document.title = `Daily Anchor - ${info.displayName}`;
    document.getElementById("course-crumb").textContent = info.displayName;
    document.getElementById("course-title").textContent = info.displayName;
    document.getElementById("course-sub").textContent = info.description ?? "";
    lessonsEl.dataset.contextLabel = info.displayName;

    const tierInfo = (window.ANCHOR_TIERS ?? []).find((t) => t.key === info.tier);
    const crumbTier = document.getElementById("course-crumb-tier");
    crumbTier.textContent = tierInfo?.displayName ?? "Courses";
    crumbTier.href = info.tier ? `courses.html?tier=${encodeURIComponent(info.tier)}` : "courses.html";
    mountSidebar(info.tier ?? null);

    const { supabaseUrl, supabasePublishableKey } = window.ANCHOR_CONFIG;
    if (!supabaseUrl || !supabasePublishableKey) {
      statusEl.textContent = "Missing Supabase config. Fill in config.js.";
      statusEl.classList.remove("sr-only");
      return;
    }

    lessonsEl.innerHTML = renderVideoSkeletons(6);

    const url = `${supabaseUrl}/rest/v1/videos?select=*&active=eq.true&playlist=eq.${encodeURIComponent(slug)}&order=idx.asc.nullslast,published_at.desc,created_at.desc`;

    try {
      const res = await fetch(url, {
        headers: {
          apikey: supabasePublishableKey,
          Authorization: `Bearer ${supabasePublishableKey}`,
        },
      });

      if (!res.ok) throw new Error(`Supabase request failed: ${res.status}`);

      const videos = await res.json();

      if (videos.length === 0) {
        lessonsEl.innerHTML = "";
        statusEl.textContent = "No lessons yet.";
        statusEl.classList.remove("sr-only");
        return;
      }

      statusEl.remove();
      lessonsEl.innerHTML = renderLessons(videos, Boolean(info.ordered));
      lessonsEl.addEventListener("click", onThumbGridClick);

      const playAllBtn = document.getElementById("play-all-lessons");
      playAllBtn.hidden = false;
      playAllBtn.addEventListener("click", () => window.AnchorPlayer?.playAll(lessonsEl));

      // Only worth a "Resume" CTA when there's real partial progress —
      // signed out (viewedSet is null), zero watched, or fully watched all
      // render nothing here rather than a misleading/empty button.
      const viewedSet = await markViewedBadges(lessonsEl, videos.map((v) => v.youtube_video_id));
      const resumeSlot = document.getElementById("resume-slot");
      if (viewedSet) {
        const watchedCount = videos.filter((v) => viewedSet.has(v.youtube_video_id)).length;
        const next = videos.find((v) => !viewedSet.has(v.youtube_video_id));
        if (watchedCount > 0 && next) {
          // "Lesson N" only means something for ordered courses (a real,
          // stable curriculum position). Unordered courses are sorted by
          // recency, so a video's array position can shift as new videos
          // are added — labeling it a fixed lesson number would be
          // misleading there.
          const label = info.ordered ? `Resume Lesson ${videos.indexOf(next) + 1}` : "Resume";
          resumeSlot.innerHTML = `
            <button class="btn-primary resume-btn" type="button" id="resume-btn">
              <span class="material-symbols-outlined">play_arrow</span> ${label}
            </button>`;
          document.getElementById("resume-btn").addEventListener("click", () => {
            const thumb = lessonsEl.querySelector(`.thumb[data-video-id="${CSS.escape(next.youtube_video_id)}"]`);
            thumb?.scrollIntoView({ behavior: "smooth", block: "center" });
            thumb?.click();
          });
        }
      }
    } catch (err) {
      lessonsEl.innerHTML = "";
      statusEl.textContent = "Failed to load lessons.";
      statusEl.classList.remove("sr-only");
      console.error(err);
    }
  }

  mountHeader();
  initThemeToggle();
  initAuthControl();
  // loadCourse() calls mountSidebar() synchronously (before its first
  // await), so it must run before initSidebarDrawer() binds the close
  // button's listener — otherwise #sidebar-close doesn't exist yet and the
  // click handler never gets attached.
  loadCourse();
  initSidebarDrawer();
</script>
