<title>Daily Anchor - Courses</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block" />
<script src="theme-init.js"></script>
<link rel="stylesheet" href="styles.css" />
<style>
  .course-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1.2rem;
    text-decoration: none;
    color: var(--ink);
    display: block;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }

  .course-card:hover {
    box-shadow: 0 6px 18px rgba(22, 35, 63, 0.1);
    transform: translateY(-2px);
  }

  .course-card .title {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 0.35rem;
  }

  .course-card .desc {
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.4;
    margin: 0 0 0.75rem;
  }

  .course-card .meta {
    margin-top: 0;
  }

  .dept {
    margin-bottom: 2rem;
  }

  .dept-label {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.95rem;
    font-weight: 700;
    margin: 0 0 0.9rem;
  }

  .dept-label .material-symbols-outlined {
    color: var(--muted);
    font-size: 1.1rem;
  }

  .locked-card {
    background: var(--card-bg);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    color: var(--muted);
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .tier-empty {
    text-align: center;
    padding: 3.5rem 1rem;
    color: var(--muted);
  }

  .tier-empty .material-symbols-outlined {
    font-size: 2.2rem;
    display: block;
    margin: 0 auto 0.75rem;
  }

  .tier-empty p {
    max-width: 340px;
    margin: 0.35rem auto 0;
    font-size: 0.88rem;
    line-height: 1.5;
  }
</style>

<div id="app-header"></div>

<div class="drawer-backdrop" id="drawer-backdrop"></div>
<div class="app-body">
  <nav class="sidebar" id="sidebar"></nav>

  <main>
    <h2 class="page-heading" id="tier-heading">Courses</h2>
    <p class="page-sub" id="tier-sub">Complete series and curated playlists. Browse at your own pace, no daily rotation.</p>
    <div id="status" class="sr-only">Loading courses…</div>
    <div id="tier-content"></div>
  </main>
</div>

<div class="toast" id="toast">
  <span class="material-symbols-outlined" id="toast-icon"></span>
  <span id="toast-message"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="playlists.js"></script>
<script src="helpers.js"></script>
<script>
  // Subtitle shown under the tier heading. Informal tiers (see
  // window.ANCHOR_INFORMAL_TIERS in playlists.js) get their own blurb;
  // everything else falls back to the default academic-ladder copy.
  const TIER_SUBTITLES = {
    extracurricular: "Skills and curiosities outside the academic ladder. Not a rigor progression, just genuinely good content.",
    entertainment: "Travel, documentaries, and short films worth your time — not a rigor progression, just genuinely good watching.",
    miscellaneous: "Podcasts, storytelling, and business content that doesn't fit anywhere else on the ladder.",
  };

  // loadCourses re-runs on "anchor-filter-change" (see below), not just
  // once at page load — same #status re-run hazard as index.html's
  // loadVideos/loadHeadlines, same fix.
  function showStatus(el, text) {
    if (!el) return;
    el.textContent = text;
    el.classList.remove("sr-only");
  }
  function hideStatus(el) {
    el?.classList.add("sr-only");
  }

  function currentTier() {
    const requested = new URLSearchParams(location.search).get("tier");
    const known = (window.ANCHOR_TIERS ?? []).some((t) => t.key === requested);
    return known ? requested : "standard";
  }

  function courseCard(slug, info, ids, viewedSet) {
    const count = ids?.length ?? null;
    const watched = viewedSet && ids ? ids.filter((id) => viewedSet.has(id)).length : null;
    return `
      <a class="course-card" href="course.html?slug=${encodeURIComponent(slug)}">
        <div class="title">${escapeHtml(info.displayName)}</div>
        <p class="desc">${escapeHtml(info.description ?? "")}</p>
        <div class="meta">
          <span>${escapeHtml(info.source ?? "")}</span>
          ${count != null ? `<span>· ${count} lessons</span>` : ""}
          ${watched != null ? `<span>· ${watched}/${count} watched</span>` : ""}
        </div>
      </a>`;
  }

  // Guards against two overlapping loadCourses() calls (e.g. two rapid
  // filter changes) resolving out of order and the stale one winning the
  // DOM — same hazard and same fix as index.html's loadVideos/loadHeadlines.
  let coursesRequestToken = 0;

  async function loadCourses() {
    const requestToken = ++coursesRequestToken;
    const { supabaseUrl, supabasePublishableKey } = window.ANCHOR_CONFIG;
    const statusEl = document.getElementById("status");
    const contentEl = document.getElementById("tier-content");
    const tier = currentTier();
    const tierInfo = (window.ANCHOR_TIERS ?? []).find((t) => t.key === tier);

    document.getElementById("tier-heading").textContent = tierInfo?.displayName ?? "Courses";
    document.getElementById("tier-sub").textContent =
      TIER_SUBTITLES[tier] ?? "Complete series and curated playlists. Browse at your own pace, no daily rotation.";
    document.title = `Daily Anchor - ${tierInfo?.displayName ?? "Courses"}`;

    if (!supabaseUrl || !supabasePublishableKey) {
      showStatus(statusEl, "Missing Supabase config. Fill in config.js.");
      return;
    }

    const allCourses = Object.entries(window.ANCHOR_PLAYLISTS ?? {}).filter(([, info]) => info.type === "course");
    const tierCourses = allCourses.filter(([, info]) => info.tier === tier);
    const departments = window.ANCHOR_TIER_DEPARTMENTS?.[tier] ?? [];
    const isInformalTier = (window.ANCHOR_INFORMAL_TIERS ?? []).includes(tier);

    if (tierCourses.length === 0) {
      hideStatus(statusEl);
      contentEl.innerHTML = `
        <div class="tier-empty">
          <span class="material-symbols-outlined">hourglass_empty</span>
          <strong>${escapeHtml(tierInfo?.displayName ?? "This tier")}: coming soon</strong>
          <p>This tier is part of the plan but doesn't have courses yet. It'll fill in as more content is curated.</p>
        </div>`;
      return;
    }

    // Distinct from the "coming soon" empty state above — these courses
    // exist, just none match the current sidebar filter. Different message
    // since "coming soon" would wrongly imply nothing's been curated yet.
    const { regions, languages } = getRegionLangFilter();
    const filteredCourses = tierCourses.filter(([, info]) => matchesRegionLangFilter(info.region, info.language, regions, languages));

    if (filteredCourses.length === 0) {
      hideStatus(statusEl);
      contentEl.innerHTML = `
        <div class="tier-empty">
          <span class="material-symbols-outlined">filter_alt_off</span>
          <strong>No courses match your region/language filter</strong>
          <p>Try adding more regions or languages from the sidebar filter.</p>
        </div>`;
      return;
    }

    contentEl.innerHTML = departments
      .map(
        (dept) => `
        <div class="dept">
          <div class="skeleton line" style="width: 160px; height: 1.1rem;"></div>
          <div class="card-grid">${renderCourseSkeletons(2)}</div>
        </div>`
      )
      .join("");

    try {
      const [results, viewedSet] = await Promise.all([
        Promise.allSettled(filteredCourses.map(([slug]) => fetchLessonIds(slug))),
        fetchViewedSet(),
      ]);
      if (requestToken !== coursesRequestToken) return;
      const idsBySlug = Object.fromEntries(filteredCourses.map(([slug], i) => [slug, results[i].status === "fulfilled" ? results[i].value : null]));

      hideStatus(statusEl);

      const sections = departments
        .map((deptKey) => {
          const deptInfo = window.ANCHOR_DEPARTMENTS?.[deptKey];
          const deptCourses = filteredCourses.filter(([, info]) => info.department === deptKey);

          if (deptCourses.length === 0) {
            if (isInformalTier) return ""; // no fixed promise for informal tiers
            return `
              <div class="dept">
                <div class="dept-label"><span class="material-symbols-outlined">${deptInfo?.icon ?? "folder"}</span><span>${escapeHtml(deptInfo?.displayName ?? deptKey)}</span></div>
                <div class="locked-card"><span class="material-symbols-outlined">lock</span> No courses yet</div>
              </div>`;
          }

          return `
            <div class="dept">
              <div class="dept-label"><span class="material-symbols-outlined">${deptInfo?.icon ?? "folder"}</span><span>${escapeHtml(deptInfo?.displayName ?? deptKey)}</span></div>
              <div class="card-grid">
                ${deptCourses.map(([slug, info]) => courseCard(slug, info, idsBySlug[slug], viewedSet)).join("")}
              </div>
            </div>`;
        })
        .join("");

      contentEl.innerHTML = sections;
    } catch (err) {
      if (requestToken !== coursesRequestToken) return;
      contentEl.innerHTML = "";
      showStatus(statusEl, "Failed to load courses.");
      console.error(err);
    }
  }

  mountHeader();
  mountSidebar(currentTier());
  initThemeToggle();
  initSidebarDrawer();
  initAuthControl();
  initRegionLangFilter();
  loadCourses();
  window.addEventListener("anchor-filter-change", loadCourses);
  // Completing sign-in (OTP) mid-session doesn't otherwise touch the
  // watched-progress counts on each course card (fetchViewedSet, checked
  // once per load) — this re-runs the whole load, same as a filter change.
  window.addEventListener("anchor-auth-change", loadCourses);
</script>
